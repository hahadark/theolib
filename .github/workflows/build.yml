name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: 빌드 (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Tauri CLI 설치 (미리 빌드된 실행 파일)
        run: cargo binstall tauri-cli --version ^2 --no-confirm --locked

      - name: 빌드 (NSIS 설치본)
        run: cargo tauri build --bundles nsis

      - name: 설치본 이름 정리
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1 | Copy-Item -Destination "dist/Theolib-$v-windows-x64-setup.exe"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: 신학-서재-윈도우
          path: dist/*.exe
          if-no-files-found: error

      - name: 태그 릴리스 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 신학 서재 ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          make_latest: true
          files: dist/*.exe

  build-macos:
    name: 빌드 (macOS)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Tauri CLI 설치 (미리 빌드된 실행 파일)
        run: cargo binstall tauri-cli --version ^2 --no-confirm --locked

      - name: 빌드 (.app 번들)
        run: cargo tauri build --bundles app

      - name: 앱 압축
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA:0:7}"; fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/*.app "dist/Theolib-$v-mac-arm64.zip"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: 신학-서재-맥
          path: dist/*.zip
          if-no-files-found: error

      - name: 태그 릴리스 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 신학 서재 ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          make_latest: true
          files: dist/*.zip
