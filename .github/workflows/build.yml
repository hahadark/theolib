name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: 빌드 (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Tauri CLI 설치 (미리 빌드된 실행 파일)
        run: cargo binstall tauri-cli --version ^2 --no-confirm --locked

      - name: 빌드 (NSIS 설치본)
        run: cargo tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: 신학-서재-윈도우
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 태그 릴리스 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe

  build-macos:
    name: 빌드 (macOS)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Tauri CLI 설치 (미리 빌드된 실행 파일)
        run: cargo binstall tauri-cli --version ^2 --no-confirm --locked

      - name: 빌드 (.app 번들)
        run: cargo tauri build --bundles app

      - uses: actions/upload-artifact@v4
        with:
          name: 신학-서재-맥
          path: target/release/bundle/macos/*.app
          if-no-files-found: error

      - name: 태그 릴리스 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/macos/*.app
