name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: 빌드 (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Tauri CLI 설치 (미리 빌드된 실행 파일)
        run: cargo binstall tauri-cli --version ^2 --no-confirm --locked

      - name: 빌드 (NSIS 설치본)
        run: cargo tauri build --bundles nsis

      - name: 설치본 이름 정리
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1 | Copy-Item -Destination "dist/Theolib-$v-windows-x64-setup.exe"
          # 포터블: 설치 없이 실행하는 exe 하나(화면 파일·글꼴은 exe 안에 들어 있음)를 zip 으로
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item target/release/theolib-app.exe -Destination "portable/Theolib.exe"
          Set-Content -Encoding utf8 -Path "portable/읽어 보세요.txt" -Value @(
            "신학 서재 포터블판 ($v)",
            "",
            "설치 없이 Theolib.exe 를 바로 실행합니다.",
            "필요한 것: Microsoft Edge WebView2 런타임(윈도우 10·11에는 보통 이미 들어 있습니다).",
            "내려받은 자료·설정·책갈피는 이 폴더가 아니라 사용자 폴더(AppData)에 저장됩니다.",
            "서명이 없어 처음 실행할 때 'PC 보호' 창이 뜨면 '추가 정보 → 실행'을 누르세요."
          )
          Compress-Archive -Path portable/* -DestinationPath "dist/Theolib-$v-windows-x64-portable.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: 신학-서재-윈도우
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: 태그 릴리스 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 신학 서재 ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/*.exe
            dist/*.zip

  build-macos:
    name: 빌드 (macOS)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Tauri CLI 설치 (미리 빌드된 실행 파일)
        run: cargo binstall tauri-cli --version ^2 --no-confirm --locked

      - name: 빌드 (.app 번들)
        run: cargo tauri build --bundles app

      - name: 앱 압축
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA:0:7}"; fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/*.app "dist/Theolib-$v-mac-arm64.zip"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: 신학-서재-맥
          path: dist/*.zip
          if-no-files-found: error

      - name: 태그 릴리스 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 신학 서재 ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          make_latest: true
          files: dist/*.zip
