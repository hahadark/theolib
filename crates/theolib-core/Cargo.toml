[package]
name = "theolib-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
encoding_rs = "0.8.44"
flate2 = "1.1.11"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"
ureq = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"
